<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squared Paper Tic-Tac-Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
/* Layout: one centered column on squared exercise paper; ink-blue X, red-pencil O, a ruled margin line */
:root {
  --paper: #f7f8fb;
  --grid: #dfe5f0;
  --margin: #e9a3a3;
  --ink: #1d2433;
  --muted: #677189;
  --x: #2449c9;
  --o: #d23c3c;
  --line: #1d2433;
  --chip: #ffffff;
  --chip-border: #cfd6e4;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151a24; --grid: #222a39; --margin: #6b3238; --ink: #e8ecf4; --muted: #8f9ab0;
    --x: #7d9bff; --o: #ff7b72; --line: #e8ecf4; --chip: #1c2230; --chip-border: #2f3849;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151a24; --grid: #222a39; --margin: #6b3238; --ink: #e8ecf4; --muted: #8f9ab0;
  --x: #7d9bff; --o: #ff7b72; --line: #e8ecf4; --chip: #1c2230; --chip-border: #2f3849;
  color-scheme: dark;
}

html, body { min-height: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(to right, transparent 46px, var(--margin) 46px, var(--margin) 48px, transparent 48px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100% 100%, 24px 24px, 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 48px;
}
.wrap { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

header { display: flex; flex-direction: column; gap: 4px; }
h1 {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 8vw, 2.75rem);
  line-height: 1; margin: 0; letter-spacing: -0.02em; text-wrap: balance;
}
h1 .x { color: var(--x); } h1 .o { color: var(--o); }
.sub { color: var(--muted); margin: 0; font-size: 0.95rem; }

.modes { display: flex; flex-wrap: wrap; gap: 8px; }
.seg {
  display: inline-flex; border: 1px solid var(--chip-border); border-radius: 999px;
  background: var(--chip); padding: 3px;
}
.seg button {
  font: 500 0.85rem var(--font-body); color: var(--muted); background: transparent;
  border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button:focus-visible, .cell:focus-visible, .actions button:focus-visible {
  outline: 2px solid var(--x); outline-offset: 2px;
}
.seg[hidden] { display: none !important; }

.status {
  font-family: var(--font-display); font-weight: 500; font-size: 1.35rem; min-height: 1.6em;
  display: flex; align-items: center; gap: 10px;
}
.status .mark { width: 22px; height: 22px; flex: none; }

.board {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 1;
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
}
.board > svg.grid, .board > svg.strike { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.grid path { stroke: var(--line); stroke-width: 2.2; stroke-linecap: round; fill: none; opacity: 0.85; }
.cell {
  appearance: none; background: transparent; border: 0; padding: 14%; cursor: pointer;
  display: grid; place-items: center; border-radius: 10px; color: inherit;
}
.cell:disabled { cursor: default; }
.cell:not(:disabled):hover { background: color-mix(in srgb, var(--grid) 55%, transparent); }
.cell svg { width: 100%; height: 100%; overflow: visible; }
.cell path, .cell circle, .status path, .status circle { fill: none; stroke-linecap: round; }
.mk-x { stroke: var(--x); stroke-width: 9; }
.mk-o { stroke: var(--o); stroke-width: 9; }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 0.28s ease-out forwards; }
.draw.second { animation-delay: 0.16s; }
.cell.dim svg { opacity: 0.28; transition: opacity 0.3s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.strike line { stroke: var(--line); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 0.4s 0.2s ease-in-out forwards; }

.score {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  font-variant-numeric: tabular-nums;
}
.tally {
  background: var(--chip); border: 1px solid var(--chip-border); border-radius: 10px;
  padding: 10px 12px; display: flex; flex-direction: column; gap: 2px;
}
.tally span { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.tally b { font-family: var(--font-mono); font-size: 1.5rem; font-weight: 500; }
.tally.x b { color: var(--x); } .tally.o b { color: var(--o); }

.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions button {
  font: 600 0.9rem var(--font-body); border-radius: 10px; padding: 11px 18px; cursor: pointer;
  border: 1px solid var(--chip-border); background: var(--chip); color: var(--ink);
}
.actions button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.hint { color: var(--muted); font-size: 0.8rem; margin: 0; }

@media (prefers-reduced-motion: reduce) {
  .draw, .strike line { animation: none; stroke-dashoffset: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="x">X</span>s &amp; <span class="o">O</span>s</h1>
    <p class="sub">Three in a row across, down or diagonal wins.</p>
  </header>

  <div class="modes">
    <div class="seg" role="group" aria-label="Opponent">
      <button id="mode-cpu" data-mode="cpu" aria-pressed="true">vs Computer</button>
      <button id="mode-pvp" data-mode="pvp" aria-pressed="false">2 Players</button>
    </div>
    <div class="seg" id="levels" role="group" aria-label="Difficulty">
      <button id="lvl-easy" data-level="easy" aria-pressed="false">Easy</button>
      <button id="lvl-hard" data-level="hard" aria-pressed="true">Unbeatable</button>
    </div>
  </div>

  <div class="status" id="status" aria-live="polite"></div>

  <div class="board" id="board">
    <svg class="grid" viewBox="0 0 300 300" aria-hidden="true">
      <path d="M101 8 C 99 90, 102 200, 100 292" />
      <path d="M200 6 C 202 110, 198 210, 201 294" />
      <path d="M7 100 C 90 98, 210 103, 293 100" />
      <path d="M6 199 C 100 202, 200 197, 294 200" />
    </svg>
  </div>

  <div class="score">
    <div class="tally x"><span id="lbl-x">You · X</span><b id="sc-x">0</b></div>
    <div class="tally"><span>Draws</span><b id="sc-d">0</b></div>
    <div class="tally o"><span id="lbl-o">Computer · O</span><b id="sc-o">0</b></div>
  </div>

  <div class="actions">
    <button class="primary" id="new-round">New round</button>
    <button id="reset">Reset score</button>
  </div>
  <p class="hint">Starting player alternates each round. Use Tab and Enter to play with the keyboard.</p>
</div>

<script>
(() => {
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const boardEl = $("board");

  let S = {
    board: Array(9).fill(null), turn: "X", starter: "X", mode: "cpu", level: "hard",
    score: { X: 0, O: 0, D: 0 }, over: false, lastMove: -1
  };

  const markSVG = (p, animate) => {
    const a = animate ? " draw" : "";
    return p === "X"
      ? `<svg viewBox="0 0 100 100"><path class="mk-x${a}" pathLength="1" d="M18 18 L82 82"/><path class="mk-x${a} second" pathLength="1" d="M82 18 L18 82"/></svg>`
      : `<svg viewBox="0 0 100 100"><circle class="mk-o${a}" pathLength="1" cx="50" cy="50" r="33" transform="rotate(-90 50 50)"/></svg>`;
  };

  const cells = [];
  for (let i = 0; i < 9; i++) {
    const b = document.createElement("button");
    b.className = "cell"; b.id = "cell-" + i;
    b.addEventListener("click", () => humanMove(i));
    boardEl.appendChild(b); cells.push(b);
  }
  const strike = document.createElementNS(NS, "svg");
  strike.setAttribute("class", "strike"); strike.setAttribute("viewBox", "0 0 300 300");
  boardEl.appendChild(strike);

  const winner = b => {
    for (const l of LINES) { const [a, c, d] = l; if (b[a] && b[a] === b[c] && b[a] === b[d]) return { p: b[a], line: l }; }
    return b.every(Boolean) ? { p: "D" } : null;
  };

  function minimax(b, player) {
    const w = winner(b);
    if (w) return { s: w.p === "O" ? 10 : w.p === "X" ? -10 : 0 };
    let best = { s: player === "O" ? -Infinity : Infinity, i: -1 };
    for (let i = 0; i < 9; i++) if (!b[i]) {
      b[i] = player;
      const r = minimax(b, player === "O" ? "X" : "O");
      b[i] = null;
      const s = r.s - Math.sign(r.s) * 0.1; // prefer faster wins, slower losses
      if (player === "O" ? s > best.s : s < best.s) best = { s, i };
    }
    return best;
  }
  function cpuPick() {
    const free = S.board.map((v, i) => v ? -1 : i).filter(i => i >= 0);
    if (S.level === "easy" && Math.random() < 0.6) return free[Math.floor(Math.random() * free.length)];
    if (free.length === 9) return [0, 2, 4, 6, 8][Math.floor(Math.random() * 5)];
    return minimax(S.board.slice(), "O").i;
  }

  function place(i) {
    if (S.over || S.board[i]) return;
    S.board[i] = S.turn; S.lastMove = i;
    const w = winner(S.board);
    if (w) { S.over = true; S.score[w.p]++; S.result = w; }
    else S.turn = S.turn === "X" ? "O" : "X";
    render(i);
    maybeCpu();
  }
  function humanMove(i) {
    if (S.mode === "cpu" && S.turn === "O") return;
    place(i);
  }
  let cpuTimer = null;
  function maybeCpu() {
    clearTimeout(cpuTimer);
    if (S.mode === "cpu" && S.turn === "O" && !S.over) {
      render();
      cpuTimer = setTimeout(() => place(cpuPick()), 420);
    }
  }

  const names = () => S.mode === "cpu" ? { X: "You", O: "Computer" } : { X: "Player X", O: "Player O" };

  function render(animIdx = -1) {
    const cpuThinking = S.mode === "cpu" && S.turn === "O" && !S.over;
    const winLine = S.result && S.result.line;
    cells.forEach((c, i) => {
      const v = S.board[i];
      if (i === animIdx || (v && !c.firstChild) || (!v && c.firstChild)) c.innerHTML = v ? markSVG(v, i === animIdx) : "";
      c.disabled = S.over || !!v || cpuThinking;
      c.classList.toggle("dim", !!(S.over && winLine && !winLine.includes(i)) || !!(S.over && S.result.p === "D"));
      const r = Math.floor(i / 3) + 1, col = i % 3 + 1;
      c.setAttribute("aria-label", `Row ${r}, column ${col}: ${v || "empty"}`);
    });

    strike.innerHTML = "";
    if (winLine) {
      const ctr = k => [(k % 3) * 100 + 50, Math.floor(k / 3) * 100 + 50];
      const [x1, y1] = ctr(winLine[0]), [x2, y2] = ctr(winLine[2]);
      const ext = 34, dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
      const ux = dx / len * ext, uy = dy / len * ext;
      const ln = document.createElementNS(NS, "line");
      ln.setAttribute("x1", x1 - ux); ln.setAttribute("y1", y1 - uy);
      ln.setAttribute("x2", x2 + ux); ln.setAttribute("y2", y2 + uy);
      ln.setAttribute("pathLength", "1");
      ln.style.strokeWidth = "9"; ln.style.stroke = S.result.p === "X" ? "var(--x)" : "var(--o)"; ln.style.opacity = "0.9";
      strike.appendChild(ln);
    }

    const n = names(), st = $("status");
    const icon = p => `<span class="mark">${markSVG(p, false)}</span>`;
    if (S.over) {
      if (S.result.p === "D") st.innerHTML = "Cat's game. It's a draw.";
      else if (S.mode === "cpu") st.innerHTML = icon(S.result.p) + (S.result.p === "X" ? "You win this round." : "The computer wins this one.");
      else st.innerHTML = icon(S.result.p) + `${n[S.result.p]} wins.`;
    } else if (cpuThinking) st.innerHTML = icon("O") + "Computer is thinking…";
    else st.innerHTML = icon(S.turn) + (S.mode === "cpu" ? "Your move." : `${n[S.turn]} to move.`);

    $("sc-x").textContent = S.score.X; $("sc-o").textContent = S.score.O; $("sc-d").textContent = S.score.D;
    $("lbl-x").textContent = `${n.X} · X`; $("lbl-o").textContent = `${n.O} · O`;
    document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
    document.querySelectorAll("[data-level]").forEach(b => b.setAttribute("aria-pressed", b.dataset.level === S.level));
    $("levels").hidden = S.mode !== "cpu";
  }

  function newRound(alternate = true) {
    clearTimeout(cpuTimer);
    if (alternate) S.starter = S.starter === "X" ? "O" : "X";
    S.board = Array(9).fill(null); S.turn = S.starter; S.over = false; S.result = null; S.lastMove = -1;
    cells.forEach(c => c.innerHTML = "");
    render(); maybeCpu();
  }

  $("new-round").addEventListener("click", () => newRound(true));
  $("reset").addEventListener("click", () => { S.score = { X: 0, O: 0, D: 0 }; S.starter = "O"; newRound(true); });
  document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
    if (S.mode === b.dataset.mode) return;
    S.mode = b.dataset.mode; S.score = { X: 0, O: 0, D: 0 }; S.starter = "O"; newRound(true);
  }));
  document.querySelectorAll("[data-level]").forEach(b => b.addEventListener("click", () => {
    S.level = b.dataset.level; render();
  }));

  function start(saved) {
    if (saved && saved.board) S = Object.assign(S, saved);
    cells.forEach(c => c.innerHTML = "");
    render(); maybeCpu();
  }
  window.claude?.hot?.snapshot?.(() => ({ ...S }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
